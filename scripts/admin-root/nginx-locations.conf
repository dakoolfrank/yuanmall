root /production/yuanmall/web/current/admin;
index index.html;
client_max_body_size 32m;
access_log /var/log/nginx/mall.access.log qcc_no_query;
error_log /var/log/nginx/mall.error.log warn;

location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =404;
}
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
}
location ^~ /assets/ {
    expires 7d;
    try_files $uri =404;
}

# Keep existing bookmarks and in-flight requests from the previous release usable.
location = /admin { return 302 https://$host/$is_args$args; }
location = /admin/ { return 302 https://$host/$is_args$args; }
location ^~ /admin/assets/ {
    root /production/yuanmall/web/current;
    expires 7d;
    try_files $uri =404;
}
location /admin/ { rewrite ^/admin/(.*)$ https://$host/$1 redirect; }

location ^~ /admin-api/ { include snippets/yuanmall-proxy.conf; }
location ^~ /app-api/ { include snippets/yuanmall-proxy.conf; }
location = /infra/ws {
    include snippets/yuanmall-proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
location / { try_files $uri $uri/ /index.html; }

include snippets/yuanmall-assets-locations.conf;
