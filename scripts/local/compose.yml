name: yuanmall-local

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: yuanmall
      MYSQL_USER: yuanmall
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in _local/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in _local/.env}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    ports:
      - '127.0.0.1:13306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../ruoyi-vue-pro/sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ../../ruoyi-vue-pro/sql/mysql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ../../ruoyi-vue-pro/sql/local/extracted/member.sql:/docker-entrypoint-initdb.d/03-member.sql:ro
      - ../../ruoyi-vue-pro/sql/local/extracted/pay.local.sql:/docker-entrypoint-initdb.d/04-pay.sql:ro
      - ../../ruoyi-vue-pro/sql/local/extracted/mall.sql:/docker-entrypoint-initdb.d/05-mall.sql:ro
      - ../../_local/db-local.sql:/docker-entrypoint-initdb.d/06-local.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h127.0.0.1 -uroot -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --requirepass, '${REDIS_PASSWORD:?Set REDIS_PASSWORD in _local/.env}', --appendonly, 'yes']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:16379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  maven:
    image: maven:3.9-eclipse-temurin-8
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - ../../ruoyi-vue-pro:/workspace
      - maven-cache:/root/.m2
      - ../../_local/maven-settings.xml:/root/.m2/settings.xml:ro
    environment:
      MAVEN_OPTS: '-Xmx2g -Dfile.encoding=UTF-8'
    command: [mvn, -B, -ntp, package, -pl, yudao-server, -am, '-Dmaven.test.skip=true']

  backend:
    image: eclipse-temurin:8-jre
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../ruoyi-vue-pro/yudao-server/target/yudao-server.jar:/app/app.jar:ro
      - ../../_local/logs:/root/logs
      - ../../_local/uploads:/app/uploads
    command: [java, -Xms512m, -Xmx1536m, '-Dfile.encoding=UTF-8', -jar, /app/app.jar]
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: 'jdbc:mysql://mysql:3306/yuanmall?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true'
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: yuanmall
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_URL: 'jdbc:mysql://mysql:3306/yuanmall?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai'
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_USERNAME: yuanmall
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: '6379'
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_QUARTZ_AUTO_STARTUP: 'false'
      SPRING_BOOT_ADMIN_CLIENT_ENABLED: 'false'
      SPRING_BOOT_ADMIN_SERVER_ENABLED: 'false'
      SPRING_DATASOURCE_DRUID_STAT_VIEW_SERVLET_ENABLED: 'false'
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      YUDAO_CAPTCHA_ENABLE: 'false'
      YUDAO_SECURITY_MOCK_ENABLE: 'false'
      YUDAO_SMS_CODE_BEGIN_CODE: '100000'
      YUDAO_SMS_CODE_END_CODE: '999999'
      YUDAO_TRADE_ORDER_STATUS_SYNC_TO_WXA_ENABLE: 'false'
      YUDAO_PAY_ORDER_NOTIFY_URL: 'http://backend:48080/admin-api/pay/notify/order'
      YUDAO_PAY_REFUND_NOTIFY_URL: 'http://backend:48080/admin-api/pay/notify/refund'
      YUDAO_PAY_TRANSFER_NOTIFY_URL: 'http://backend:48080/admin-api/pay/notify/transfer'
      YUDAO_DEMO: 'false'
    ports:
      - '127.0.0.1:48080:48080'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  maven-cache:
